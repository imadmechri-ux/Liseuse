<!DOCTYPE html>
<html lang="fr">
<head>

<title>Fiqh malikite · Liseuse</title>

<style>
/* VOICE: calme, studieux, respectueux — un livre d'étude qu'on reprend chaque jour
   IDEA: un cahier de cours relié à la façon des reliures de Fès : couverture vert profond, filet doré, pages claires
   PICTURE: la carte « Reprendre » avec l'anneau de progression, puis la page elle-même
   COLOUR and TYPE: vert de Fès #0d4a3c dominant, papier clair, or #c99a2e en accent ; Literata pour lire, Hanken Grotesk pour l'interface, Amiri pour l'arabe
   LAYOUT: une colonne de lecture de 680px, barre d'outils en bas au pouce, feuilles qui montent du bas */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaf6,#111614);--paper:light-dark(#ffffff,#171d1b);--ink:light-dark(#1c2321,#e6e9e4);--mute:light-dark(#5d6763,#9aa6a0);
--line:light-dark(#e4e1d8,#2a3330);--green:#0d4a3c;--green2:light-dark(#0d4a3c,#5fb79c);--gold:#c99a2e;--gold2:light-dark(#9a7213,#e2b955);
--chip:light-dark(#eef3f0,#1f2a27);--hl1:light-dark(#fff1b8,#5a4b12);--hl2:light-dark(#d7f0dd,#1f4a32);--hl3:light-dark(#dbe8fb,#1f3552);
--on:#fff;--fs:18px;--lh:1.68;--rf:'Literata',Georgia,serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-ff=sans]{--rf:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Hanken Grotesk',system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:16px 'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left))}
/* ---------- Accueil ---------- */
.cover{background:var(--green);color:var(--on);padding:calc(22px + env(safe-area-inset-top)) 0 70px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,transparent 18px 26px);opacity:.75}
.cover svg.orn{position:absolute;right:-60px;top:-40px;width:300px;height:300px;opacity:.13}
.kicker{font-size:14px;opacity:.85}
.cover h1{font:600 clamp(32px,7vw,46px)/1.05 'Literata',serif;margin:6px 0 6px;text-wrap:balance}
.cover p{margin:0;opacity:.85;font-size:15px}
.resume{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:-50px;position:relative;box-shadow:0 10px 30px -18px #0005;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 22px 'Literata',serif}
.ring small{display:block;font:500 11px 'Hanken Grotesk';color:var(--mute);margin-top:-30px;text-align:center}
.resume h2{margin:0;font:600 19px/1.25 'Literata',serif}
.resume .meta{color:var(--mute);font-size:14px;margin:4px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--green);color:var(--on);font-weight:600}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 6px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:600 19px/1.2 'Literata',serif;white-space:nowrap}.stat span{color:var(--mute);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 8px;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip);font-weight:500;font-size:15px}
.tabs button[aria-selected=true]{background:var(--green);color:var(--on)}
.search{position:relative;margin:6px 0 10px}.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--mute)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--chip);font:600 16px 'Literata',serif;color:var(--green2)}
.row.done .n{background:var(--green);color:var(--on)}
.row h3{margin:0;font:600 16px/1.3 'Literata',serif}.row p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.row .pc{font-size:13px;color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);padding:28px 6px;text-align:center}
.item{padding:14px 4px;border-bottom:1px solid var(--line)}
.item .src{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .txt{font-family:var(--rf);margin:6px 0;font-size:16px;line-height:1.55}
.item .note{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:15px;white-space:pre-wrap}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gl-item{padding:12px 4px;border-bottom:1px solid var(--line)}
.gl-item h3{margin:0;font:600 17px 'Literata',serif;display:flex;justify-content:space-between;gap:10px}
.gl-item h3 span{font:400 22px 'Amiri',serif;color:var(--green2)}

mark{background:var(--hl1);color:inherit;border-radius:3px}
.foot{color:var(--mute);font-size:13px;padding:30px 0 calc(40px + env(safe-area-inset-bottom));text-align:center}
.sync{display:inline-flex;align-items:center;gap:6px}.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.sync.on i{background:#2e9b6e}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{display:flex;align-items:center;gap:6px;height:56px}
.top h2{flex:1;margin:0;font:600 15px/1.2 'Hanken Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h2 small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.ib:hover{background:var(--chip)}.ib svg{width:22px;height:22px}
.ib.on{color:var(--gold2)}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.page{max-width:680px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left)) 140px;font-family:var(--rf);font-size:var(--fs);line-height:var(--lh)}
.chead{margin:4px 0 22px}
.chead .k{font:600 13px 'Hanken Grotesk';color:var(--gold2);letter-spacing:.02em}
.chead h1{font:600 clamp(30px,6vw,40px)/1.08 'Literata',serif;margin:4px 0 4px}
.chead .d{color:var(--mute);font:15px 'Hanken Grotesk'}
.ess{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--paper);border-radius:12px;padding:14px 16px;margin:18px 0 26px;font-size:.92em}
.ess summary{font:600 15px 'Hanken Grotesk';cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
.ess summary::-webkit-details-marker{display:none}
.ess p{margin:10px 0 4px}
.ess .acts{font-family:'Hanken Grotesk',sans-serif;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:15px}
.blk{position:relative;border-radius:8px;margin:0 -8px;padding:2px 8px;transition:background .25s;scroll-margin-top:80px}
.blk.h2{font:600 1.32em/1.25 'Literata',serif;margin-top:1.4em;margin-bottom:.4em;color:var(--green2)}
:root[data-ff=sans] .blk.h2{font-family:'Hanken Grotesk'}
.blk.h3{font-weight:600;margin-top:1.1em;margin-bottom:.2em}
.blk.p{margin-bottom:.7em}
.blk.li{padding-left:28px;margin-bottom:.45em}
.blk.li::before{content:"";position:absolute;left:12px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.blk.li.l2{padding-left:50px}.blk.li.l2::before{left:34px;background:transparent;border:1.5px solid var(--gold)}
.blk.ans{background:var(--chip);margin:0 0 .8em;padding:8px 12px;border-radius:10px}
.blk.fig{margin:1em -8px}.blk.fig img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.blk.arp button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font:15px 'Hanken Grotesk';color:var(--mute)}
.blk.arp button b{font:700 22px 'Amiri',serif;color:var(--green2)}
.blk.hl1{background:var(--hl1)}.blk.hl2{background:var(--hl2)}.blk.hl3{background:var(--hl3)}
.blk.flash{animation:fl 1.6s}@keyframes fl{0%,40%{background:color-mix(in srgb,var(--gold) 30%,transparent)}}
.blk.speaking{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.blk .mk{position:absolute;right:-22px;top:4px;width:14px;height:20px;color:var(--gold)}
.blk .nt{display:block;font:14.5px/1.45 'Hanken Grotesk';background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0 4px;white-space:pre-wrap}
.blk .nt::before{content:"Ma note · ";font-weight:600;color:var(--gold2)}
.arx{font-family:'Amiri',serif;font-size:1.08em}
button.ar{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:7px;background:var(--chip);color:var(--green2);font:700 17px/1 'Amiri',serif;vertical-align:baseline;margin:0 2px}
sup.fn{color:var(--gold2);font:600 .68em 'Hanken Grotesk';cursor:pointer;padding:0 3px;margin-left:1px}
i.gl{text-decoration:underline dotted var(--gold);text-underline-offset:3px;cursor:pointer}
.endc{line-height:1.5;margin:40px 0 0;padding:20px;border-radius:16px;background:var(--paper);border:1px solid var(--line);font-family:'Hanken Grotesk';text-align:center}
.endc h3{font:600 22px 'Literata',serif;margin:6px 0}
.endc .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);transition:transform .25s}
.dock .in{display:flex;justify-content:space-around;max-width:680px;margin:0 auto;height:60px;align-items:center}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);min-width:56px;min-height:48px;justify-content:center}
.dock button svg{width:23px;height:23px;color:var(--ink)}
.dock button.on svg,.dock button.on{color:var(--gold2)}
body.focus .top,body.focus .dock{transform:translateY(110%)}body.focus .top{transform:translateY(-110%)}
.top{transition:transform .25s}
.tts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:21;background:var(--green);color:var(--on);border-radius:999px;display:flex;align-items:center;gap:4px;padding:4px 6px 4px 14px;box-shadow:0 8px 24px -10px #0008;font-size:14px}
.tts .ib{width:40px;height:40px}.tts .ib:hover{background:#ffffff22}
.thm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:6px 0 14px}
.thm button{border-radius:14px;padding:0;overflow:hidden;border:2px solid var(--line);text-align:left;min-height:96px;display:flex;flex-direction:column}
.thm button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.thm .pv{flex:1;padding:8px 10px;font:600 20px/1 'Literata',serif;position:relative}
.thm .pv i{position:absolute;left:10px;right:10px;bottom:8px;height:6px;border-radius:3px}
.thm .pv i+i{bottom:18px;right:40%}
.thm .nm{font:500 12px/1.25 'Hanken Grotesk';padding:6px 8px;background:var(--paper);color:var(--ink);border-top:1px solid var(--line)}
.cust{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.cust label{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:8px 10px;font-size:14px}
.cust input[type=color]{width:40px;height:34px;padding:0;border:0;border-radius:8px;background:none;flex:none}
/* ---------- Feuilles ---------- */
.scrim{position:fixed;inset:0;background:#0007;z-index:40;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;padding:8px 0 calc(18px + env(safe-area-inset-bottom));animation:up .25s;max-width:720px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font:600 19px 'Literata',serif;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.sheet .sw{padding:0 20px}
.pop{font-size:15.5px;line-height:1.55}
.pop .ar{font:400 30px/1.4 'Amiri',serif;color:var(--green2);direction:rtl}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14.5px}
.seg button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 4px #0002;font-weight:600}
.lab{font-size:13px;color:var(--mute);margin:6px 0 2px}
.rowx{display:flex;align-items:center;gap:10px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--green)}
.acts3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0}
.acts3 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--chip);font-size:13px;min-height:72px}
.acts3 button svg{width:22px;height:22px}
.dots{display:flex;gap:12px;margin:8px 0 14px}
.dots button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.dots button[aria-pressed=true]{border-color:var(--ink)}
.toc a{display:block;padding:9px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:15px}
.toc a.h2{font-weight:600}.toc a.h3{padding-left:18px;color:var(--mute);font-size:14px}
.toc a.cur{color:var(--gold2)}
/* fac-similé */
.fax{position:fixed;inset:0;z-index:50;background:#1b1b1b;display:flex;flex-direction:column}
.fax .bar2{display:flex;align-items:center;gap:6px;color:#fff;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:#111}
.fax .bar2 span{flex:1;text-align:center;font-size:15px}
.fax .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.fax img{display:block;width:100%;max-width:900px;margin:0 auto;background:#fff}
.fax.z img{width:200%;max-width:none}
/* fiches */
.card{perspective:1200px;margin:8px 0 14px;min-height:260px}
.card .face{border-radius:18px;padding:24px 20px;min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center;font:500 20px/1.4 'Literata',serif;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.card .face.a{background:color-mix(in srgb,var(--green) 9%,var(--paper));font:17px/1.55 'Literata',serif}
.card .face small{font:500 13px 'Hanken Grotesk';color:var(--mute);margin-bottom:10px;display:block}
.cnt{color:var(--mute);font-size:13.5px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14.5px;animation:up .2s;max-width:90vw;text-align:center}
@media(min-width:900px){.blk .mk{right:-26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const IV=[0,1,3,7,16,35];
function isDue(i,j){const s=S.cards[i+'.'+j];return !s||s.d<=now()}
function review(ci){let q=[];(ci<0?C().map((c,i)=>i):[ci]).forEach(i=>C()[i].cards.forEach((c,j)=>{if(ci>=0||isDue(i,j))q.push([i,j])}));
 if(ci>=0)q.sort((a,b)=>(isDue(...b)?1:0)-(isDue(...a)?1:0));
 if(!q.length){return sheet('<h3>Fiches</h3><p class="empty">Rien à revoir aujourd\'hui. Revenez demain, ou choisissez un cours pour réviser toutes ses fiches.</p>')}
 let n=0,ok=0;const total=q.length;
 const draw=()=>{if(n>=q.length){$('.sheet .sw').innerHTML=`<h3>Révision terminée</h3><p class="empty" style="padding:10px">${ok} / ${total} fiches sues du premier coup.</p><button class="btn" style="width:100%" id="fin">Fermer</button>`;$('#fin').onclick=()=>{closeSheet();if(view==='home')pane()};return}
  const[i,j]=q[n],[Q,A]=C()[i].cards[j];
  $('.sheet .sw').innerHTML=`<h3>${esc(C()[i].title)}<span class="cnt">${n+1} / ${q.length}</span></h3><div class="card"><div class="face" id="fq"><small>Question</small>${esc(Q)}<small style="margin:16px 0 0">Touchez pour voir la réponse</small></div></div><div class="two" id="ans" style="visibility:hidden"><button class="btn ghost" id="no">À revoir</button><button class="btn" id="yes">Je savais</button></div>`;
  $('#fq').onclick=function(){this.className='face a';this.innerHTML=`<small>Réponse</small>${esc(A)}`;$('#ans').style.visibility='visible';if(view==='read'&&ttsState)stopTts()};
  const grade=g=>{const k=i+'.'+j,s=S.cards[k]||{b:0};const b=g?Math.min(5,(s.b||0)+1):0;S.cards[k]={b,d:now()+IV[b]*864e5-36e5,t:now()};save();if(g)ok++;else q.push([i,j]);n++;draw()};
  $('#yes').onclick=()=>grade(1);$('#no').onclick=()=>grade(0)};
 sheet('');draw()}
/* ---------- lecture à voix haute ---------- */
let tts=null;
function speakText(k){const x=C()[cur].blocks[k];if(!x||!x.h)return '';return plain(x.h).replace(/ﷺ/g,', salla Llâhou ʿalayhi wa sallam,').replace(/رضي الله عنهما?|رضي الله عنها|رضي الله عنه|رضي الله عنهم/g,'')}
function ttsBar(){let b=$('.tts');if(!ttsState){b?.remove();$('#dtts')?.classList.remove('on');return}
 if(!b){b=document.createElement('div');b.className='tts';document.body.appendChild(b)}$('#dtts')?.classList.add('on');
 b.innerHTML=`<span>Lecture</span><button class="ib" id="tp" aria-label="${ttsState.paused?'Reprendre':'Pause'}">${ic(ttsState.paused?'play':'pause',1)}</button><button class="ib" id="ts" aria-label="Arrêter">${ic('stop',1)}</button>`;
 $('#tp').onclick=()=>{ttsState.paused?resumeT():pauseT()};$('#ts').onclick=stopTts}
function mark(k){$$('.blk.speaking').forEach(e=>e.classList.remove('speaking'));const el=$(`[data-b="${k}"]`);if(el){el.classList.add('speaking');const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-90)el.scrollIntoView({block:'center',behavior:'smooth'})}}
async function startTts(k){stopTts();const tok={k,paused:false,id:now()};ttsState=tok;ttsBar();
 if(tts){const lines=[];for(let j=k;j<C()[cur].blocks.length;j++){const t=speakText(j);if(t)lines.push({text:t.slice(0,1990),id:String(j),language:'fr',rate:S.prefs.rate})}
  try{tts.onLine?.(({id})=>{if(ttsState===tok&&id){tok.k=+id;mark(+id)}});await tts.speak(lines.slice(0,60));if(ttsState===tok){for(let s=60;s<lines.length&&ttsState===tok;s+=60)await tts.speak(lines.slice(s,s+60))}}catch(e){if(e?.code==='not_granted'){tts=null;if(ttsState===tok){ttsState=null;startTts(k)}return}}
  if(ttsState===tok)stopTts();return}
 if(!('speechSynthesis' in window)){ttsState=null;ttsBar();return toast('La lecture à voix haute n\'est pas disponible sur ce navigateur')}
 const voices=speechSynthesis.getVoices(),v=voices.find(x=>/^fr/i.test(x.lang)&&/Thomas|Amélie|Audrey|Google/i.test(x.name))||voices.find(x=>/^fr/i.test(x.lang));
 const step=j=>{if(ttsState!==tok)return;while(j<C()[cur].blocks.length&&!speakText(j))j++;if(j>=C()[cur].blocks.length)return stopTts();tok.k=j;mark(j);
  const u=new SpeechSynthesisUtterance(speakText(j));u.lang='fr-FR';if(v)u.voice=v;u.rate=S.prefs.rate;u.onend=()=>{if(ttsState===tok&&!tok.paused)step(j+1)};u.onerror=ev=>{if(ttsState===tok&&ev.error!=='interrupted'&&ev.error!=='canceled')step(j+1)};speechSynthesis.speak(u)};
 speechSynthesis.cancel();step(k)}
function pauseT(){if(!ttsState)return;ttsState.paused=true;if(tts)tts.pause?.();else speechSynthesis.cancel();ttsBar()}
function resumeT(){if(!ttsState)return;const k=ttsState.k;if(tts&&tts.resume){ttsState.paused=false;tts.resume();ttsBar()}else startTts(k)}
function ttsRate(){if(tts&&ttsState)tts.setRate?.(S.prefs.rate)}
function stopTts(){if(!ttsState)return;ttsState=null;try{tts?tts.stop():speechSynthesis.cancel()}catch(e){}$$('.blk.speaking').forEach(e=>e.classList.remove('speaking'));ttsBar()}
/* ---------- démarrage ---------- */
function route(){const m=location.hash.match(/^#cours-(\d+)$/);if(m&&D){const i=+m[1]-1;if(C()[i]){if(view!=='read'||cur!==i)openCourse(i,S.pos.c===i?S.pos.b:0);return}}if(view!=='home'||!$('.cover'))home()}
addEventListener('popstate',route);
applyPrefs();
$('#app').innerHTML='<p class="empty" style="padding-top:30vh">Ouverture du livre…</p>';
fetch('content.json').then(r=>r.json()).then(d=>{D=d;buildGl();route()}).catch(()=>{$('#app').innerHTML='<p class="empty" style="padding-top:30vh">Le contenu n\'a pas pu être chargé. Rechargez la page.</p>'});
/* capacités Claude (synchro + voix), absentes sur GitHub */
if(window.claude&&typeof window.claude.use==='function'){
 window.claude.use('tts').then(t=>{if(t)tts=t}).catch(()=>{});
 Promise.all([window.claude.use('db'),window.claude.use('user')]).then(async([db,user])=>{if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/'+BOOK);cloud={ref};let first=true;
  ref.onSnapshot(snap=>{if(!snap.exists){if(first){first=false;dirty=true;push()}return}const before=JSON.stringify(S);S=merge(S,snap.data());const changed=JSON.stringify(S)!==before;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
   if(first){first=false;const remote=JSON.stringify(merge(snap.data(),{}));if(remote!==JSON.stringify(merge(S,{}))){dirty=true;push()}if(changed){applyPrefs();if(view==='home')home()}}else if(changed&&view==='home')home();setSync(true)},e=>{cloud=null;setSync(false)})}).catch(()=>{})}
}
</script>
